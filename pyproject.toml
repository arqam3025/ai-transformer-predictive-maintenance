[project]
name = "ai-transformer-predictive-maintenance"
version = "0.1.0"
description = "AI-driven transformer DGA fault diagnosis and predictive maintenance"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
